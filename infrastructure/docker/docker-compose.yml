services:
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: automatizeit-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      # Credentials come from infrastructure/docker/.env (gitignored). The
      # password is required rather than defaulted: this file is the production
      # stack, and a baked-in database password is a committed secret. Use
      # URL-safe characters (e.g. `openssl rand -hex 32`) because the value is
      # interpolated into the connection string.
      DATABASE_URL: postgresql://${POSTGRES_USER:-automatizeit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido - ver infrastructure/docker/.env.example}@postgres:5432/${POSTGRES_DB:-automatizeit}
      REDIS_URL: redis://redis:6379
      # Required on purpose: the previous localhost default silently produced a
      # misconfigured production deployment instead of failing at `up`.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN requerido - origen del frontend, p.ej. https://app.ejemplo.com}
      # src/core/config/env.validation.ts (Joi) rejects the container at boot if
      # any of these is missing or too short, so `docker compose up` fails fast
      # here with a readable message instead of crash-looping inside the app.
      # Set them in infrastructure/docker/.env — see apps/api/.env.example.
      # Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido - minimo 32 caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET requerido - minimo 32 caracteres}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?WHATSAPP_API_TOKEN requerido}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?WHATSAPP_PHONE_NUMBER_ID requerido}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:?WHATSAPP_WEBHOOK_VERIFY_TOKEN requerido}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET requerido}
      WHATSAPP_DEFAULT_ORGANIZATION_ID: ${WHATSAPP_DEFAULT_ORGANIZATION_ID:?WHATSAPP_DEFAULT_ORGANIZATION_ID requerido}
      # AUTO-SAFETY-002: outbound-send policy, declared HERE on purpose so the
      # containment does not depend on the optional, gitignored .env.extra that
      # scripts/human-testing-up.sh rewrites. `environment:` always wins over
      # `env_file:`, so no script can lift the DENY by editing .env.extra.
      #
      # Joi (env.validation.ts) accepts ONLY the tokens ENABLED|DENIED for the
      # switch — 'true'/'1'/'yes' are rejected at boot. Keep this DENIED unless
      # real sends are explicitly authorized AND an org allowlist, a channel
      # allowlist and a non-expired OUTBOUND_SEND_UNTIL window are configured;
      # the app refuses to start on an incoherent combination.
      OUTBOUND_SEND_ENABLED: ${OUTBOUND_SEND_ENABLED:-DENIED}
      OUTBOUND_SEND_ALLOWED_ORGANIZATION_IDS: ${OUTBOUND_SEND_ALLOWED_ORGANIZATION_IDS:-}
      OUTBOUND_SEND_ALLOWED_CHANNELS: ${OUTBOUND_SEND_ALLOWED_CHANNELS:-}
      OUTBOUND_SEND_UNTIL: ${OUTBOUND_SEND_UNTIL:-}
      # Optional integrations (Pancake/SMS, sandbox routing, COOKIE_SECURE) are
      # NOT declared here on purpose: an empty value would be rejected by Joi
      # ("not allowed to be empty"). They are delivered through env_file below,
      # because compose's `.env` is interpolation-only and never reaches the
      # container. Keys in `environment:` above always win over env_file.
    env_file:
      # Gitignored (`.env.*`). Written by scripts/human-testing-up.sh --pancake
      # / --sandbox, or by hand for production. Optional: absent is fine.
      - path: .env.extra
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot migration task: `prisma migrate deploy` runs once per `up` and has
  # to finish successfully before the API is allowed to start, so a deployment
  # over an empty database ends up migrated instead of an API reporting health
  # against 0 tables.
  #
  # It lives in its own task (and not in the API entrypoint) because
  # `_prisma_migrations` has no unique index over migration_name: safety against
  # duplicated runs comes from Prisma's Postgres advisory lock, not from the
  # schema. A single task keeps concurrency out of the picture even if the API
  # service is scaled.
  #
  # GUARD (scripts/check-migrations.sh): BEFORE `migrate deploy`, the task
  # verifies that every migration on disk is approved (listed in
  # `apps/api/prisma/migrations/MIGRATIONS.sha256` with its exact sha256) and
  # that the repository and the database describe the same schema. `migrate
  # deploy` applies whatever it finds on disk without asking, and
  # `.dockerignore` does not exclude `apps/api/prisma/migrations/`, so without
  # this guard an unreviewed migration reached the container and was applied by
  # itself on the next `up`. The guard only reads: it never migrates, never
  # repairs and never approves anything by itself. If it fails, NO migration is
  # applied and the API does not start (`service_completed_successfully`).
  #
  # The script is mounted read-only: the image does not carry `scripts/`, and
  # the container has no git (the manifest is the source of truth there).
  migrate:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: automatizeit-migrate
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "sh /guard/check-migrations.sh --allow-pending && npx prisma migrate deploy",
      ]
    volumes:
      - ../../scripts:/guard:ro
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-automatizeit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido - ver infrastructure/docker/.env.example}@postgres:5432/${POSTGRES_DB:-automatizeit}
      # La guarda se monta en `/guard`, fuera del arbol del repositorio: se le
      # indica donde esta la API dentro de la imagen (WORKDIR /app/apps/api).
      API_DIR: /app/apps/api
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: automatizeit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automatizeit}
      POSTGRES_USER: ${POSTGRES_USER:-automatizeit}
      # POSTGRES_PASSWORD is only honoured on first initialization of the data
      # volume; keep it in sync with infrastructure/docker/.env afterwards.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido - ver infrastructure/docker/.env.example}

    # Bound to loopback: this compose file is also the production stack, and
    # publishing the database/Redis on every interface exposes them to the
    # network. Containers still reach each other by service name.
    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - automatizeit_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-automatizeit} -d ${POSTGRES_DB:-automatizeit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: automatizeit-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6380:6379"

    volumes:
      - automatizeit_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  automatizeit_postgres_data:
  automatizeit_redis_data:
