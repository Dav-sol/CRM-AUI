type: object
description: Request body for partially updating an organization.
properties:
  name:
    type: string
    minLength: 1
    example: Baterías del Caribe
  slug:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    example: baterias-del-caribe
  nit:
    type: string
    nullable: true
    example: "900123456-7"
  email:
    type: string
    nullable: true
    format: email
    example: contacto@bateriasdelcaribe.com
  phone:
    type: string
    nullable: true
    example: "+576001234567"
  city:
    type: string
    nullable: true
    example: Barranquilla
additionalProperties: false
