type: object

description: Base product representation.

required:
  - id
  - uuid
  - code
  - name
  - status
  - createdAt
  - updatedAt

properties:

  id:
    type: string

  uuid:
    type: string

  code:
    type: string
    description: ERP-facing reference; immutable after creation.

  name:
    type: string

  category:
    type: string
    nullable: true
    description: Free-text category (no catalog in v1).

  status:
    type: string
    enum:
      - ACTIVE
      - INACTIVE

  createdAt:
    type: string
    format: date-time

  updatedAt:
    type: string
    format: date-time