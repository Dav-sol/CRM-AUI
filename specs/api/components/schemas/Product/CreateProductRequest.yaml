type: object

description: Request body to create a product.

required:
  - code
  - name

properties:

  code:
    type: string
    maxLength: 50
    description: ERP-facing reference; immutable after creation. Duplicate codes within the organization return 409 CONFLICT (schema.prisma:128).

  name:
    type: string
    maxLength: 200

  category:
    type: string
    maxLength: 100
    description: Free-text category (no catalog in v1).

  warrantyMonths:
    type: integer
    enum: [12, 15, 18, 24]
    description: Warranty duration in months (catalog values). Defaults to the product catalog when absent.

  price:
    type: number
    minimum: 0
    description: Precio de referencia del catálogo (COP).

  status:
    type: string
    enum:
      - ACTIVE
      - INACTIVE
    description: Defaults to ACTIVE.

  organizationId:
    type: string
    description: Only accepted for PLATFORM_OWNER; required for them. Organization users must not send it (400 VALIDATION_ERROR).