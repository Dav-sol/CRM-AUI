type: object

description: Envelope for the paginated product list.

required:
  - data
  - meta

properties:

  data:
    type: array
    items:
      $ref: "./ProductSummary.yaml"

  meta:
    type: object

    required:
      - page
      - limit
      - total
      - pages

    properties:

      page:
        type: integer
        minimum: 1

      limit:
        type: integer
        minimum: 1
        maximum: 100

      total:
        type: integer
        description: Total matching products (soft-deleted excluded).

      pages:
        type: integer