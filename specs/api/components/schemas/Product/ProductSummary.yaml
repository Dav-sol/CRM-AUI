type: object

description: Product summary used in list responses.

required:
  - id
  - uuid
  - code
  - name
  - status
  - createdAt
  - updatedAt

properties:

  id:
    type: string

  uuid:
    type: string

  code:
    type: string

  name:
    type: string

  category:
    type: string
    nullable: true

  warrantyMonths:
    type: integer
    nullable: true
    description: Warranty duration in months from the product catalog (12, 15, 18 or 24).

  status:
    type: string
    enum:
      - ACTIVE
      - INACTIVE

  createdAt:
    type: string
    format: date-time

  updatedAt:
    type: string
    format: date-time