type: object

description: |
  Multipart/form-data fields of POST /imports. The file is a binary part
  named `file`. PLATFORM_OWNER additionally sends `organizationId`; sending it
  as an ORGANIZATION user returns 400 (HG-12).

properties:
  file:
    type: string
    format: binary
    description: CSV or XLSX file, max 25 MB (FR-002).

  type:
    type: string
    enum:
      - CUSTOMERS
      - PURCHASES
      - PRODUCTS

  organizationId:
    type: string
    description: Required for PLATFORM_OWNER only.

  installationFromPurchaseDate:
    type: boolean
    default: false
    description: |
      PURCHASES only. When a row has no `installationDate` column, use
      `purchaseDate` as the installation date.

      NOT a domain rule: the equivalence is only confirmed for the historical
      dataset of the Baterías del Caribe UAT, so it is an explicit per-job
      opt-in. It never becomes a default, and it does not apply to CUSTOMERS
      or PRODUCTS, where it is ignored.
