type: object

description: Full conversation representation with message history and the append-only notes log.

allOf:
  - $ref: "./ConversationSummary.yaml"

required:
  - messages
  - notes

properties:

  messages:
    type: array
    description: Message history in chronological order (FR-008, NR-003).
    items:
      $ref: "../Message/MessageSummary.yaml"

  notes:
    type: array
    description: Append-only advisor notes in chronological order (FR-007, HG-2).
    items:
      $ref: "../ConversationNote/ConversationNoteSummary.yaml"