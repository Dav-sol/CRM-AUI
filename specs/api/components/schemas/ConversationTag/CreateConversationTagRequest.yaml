type: object

description: Payload for creating a conversation tag (ADMINISTRADOR, GERENTE).

required:
  - name

properties:

  name:
    type: string
    minLength: 1
    maxLength: 50
    description: Tag name, unique within the organization.

  color:
    type: string
    pattern: "^#[0-9a-fA-F]{6}$"
    description: Optional hex color, e.g. "#0EA5E9".