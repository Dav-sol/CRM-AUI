type: object

description: Payload for updating a conversation tag (ADMINISTRADOR, GERENTE). At least one field is required.

properties:

  name:
    type: string
    minLength: 1
    maxLength: 50
    description: Tag name, unique within the organization.

  color:
    type: string
    pattern: "^#[0-9a-fA-F]{6}$"
    description: Optional hex color, e.g. "#0EA5E9".