type: object

description: Full campaign representation including template and counts.

allOf:
  - $ref: "./CampaignSummary.yaml"

required:
  - template
  - updatedAt

properties:

  template:
    type: string
    description: |
      Message template, 1..4096 chars, free text with
      {customerName}/{productName}/{organizationName} placeholders.

  updatedAt:
    type: string
    format: date-time

  followUpSequence:
    type: object
    nullable: true
    description: Follow-up sequence linked to the campaign, when present.
    required:
      - uuid
      - name
      - warrantyMonths
      - stageCount
    properties:

      uuid:
        type: string

      name:
        type: string

      warrantyMonths:
        type: integer
        enum:
          - 12
          - 15
          - 18
          - 24

      stageCount:
        type: integer