type: object

description: Dry-run segment resolution result. No automations are created and no PII is returned.

required:
  - data

properties:

  data:
    type: object

    required:
      - count
      - estimatedAutomations
      - estimatedCost

    properties:

      count:
        type: integer
        description: Qualifying customers (deduplicated, most recent purchase first).

      estimatedAutomations:
        type: integer
        description: |
          Estimated generated automations: customers × stages (or customers for
          single-template campaigns). No automations are created (dry-run).

      estimatedCost:
        type: integer
        description: |
          Estimated WhatsApp cost (COP) = estimatedAutomations × configured
          per-message rate. Estimate only; no billing in v1 (playbook §24).

      estimatedSegments:
        type: integer
        description: |
          Total de segmentos SMS estimados (Fase 1). Cada segmento = 160
          caracteres GSM-7 o 70 UCS-2. Solo aplica para channel=SMS.

      estimatedMessages:
        type: integer
        description: |
          Total de mensajes SMS estimados (Fase 1). Para SMS, messages =
          segments. Solo aplica para channel=SMS.

      currency:
        type: string
        description: |
          Moneda del costo estimado (COP para SMS). Solo incluido cuando
          channel=SMS.