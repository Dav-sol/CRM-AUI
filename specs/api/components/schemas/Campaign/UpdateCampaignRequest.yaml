type: object

description: |
  Partial update of a campaign. Only allowed while the campaign is DRAFT;
  at least one field must be provided. The segment, when present, must
  include at least one criterion.

properties:

  name:
    type: string
    minLength: 1
    maxLength: 120

  description:
    type: string
    maxLength: 1000

  type:
    type: string
    enum:
      - AUTOMATIC
      - MANUAL
      - REPURCHASE
      - SPECIAL

  template:
    type: string
    minLength: 1
    maxLength: 4096

  segment:
    $ref: "./CampaignSegment.yaml"

  startAt:
    type: string
    format: date-time