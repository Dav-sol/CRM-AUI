type: object

description: |
  Partial update of a campaign. Only allowed while the campaign is DRAFT or
  APPROVED (before activation); at least one field must be provided. The
  segment, when present, must include at least one criterion.

properties:

  name:
    type: string
    minLength: 1
    maxLength: 120

  description:
    type: string
    maxLength: 1000

  type:
    type: string
    enum:
      - AUTOMATIC
      - MANUAL
      - REPURCHASE
      - SPECIAL

  followUpSequenceId:
    type: string
    format: uuid
    description: Optional reference to a FollowUpSequence. If provided, the sequence's stages and templates will be used.

  template:
    type: string
    minLength: 1
    maxLength: 4096

  segment:
    $ref: "./CampaignSegment.yaml"

  stages:
    type: array
    maxItems: 20
    description: |
      Etapas inline del timeline (Fase 1). Excluyente con followUpSequenceId.
      Un array vacío limpia las etapas inline existentes.
    items:
      $ref: "./CampaignStage.yaml"

  startAt:
    type: string
    format: date-time

  channel:
    type: string
    enum:
      - SMS
      - WHATSAPP_CLIENTS
    description: |
      Canal de envío (Fase 1). Solo editable en DRAFT/APPROVED.