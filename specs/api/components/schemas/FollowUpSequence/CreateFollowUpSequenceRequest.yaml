type: object
description: Payload to create a follow-up sequence.
required:
  - name
  - warrantyMonths
  - stages
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  description:
    type: string
    maxLength: 1000
  warrantyMonths:
    type: integer
    enum: [12, 15, 18, 24]
    description: Warranty duration in months (catalog values).
  stages:
    type: array
    minItems: 1
    items:
      $ref: "./FollowUpSequenceStage.yaml"
    description: At least one stage required.