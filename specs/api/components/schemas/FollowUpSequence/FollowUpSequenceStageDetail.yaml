type: object
required:
  - uuid
  - name
  - anchor
  - offsetDays
  - template
  - createdAt
properties:
  uuid:
    type: string
  name:
    type: string
  anchor:
    type: string
    enum: [PURCHASE_DATE, WARRANTY_EXPIRY]
  offsetDays:
    type: integer
  template:
    type: string
  templateOnPast:
    type: string
    nullable: true
  createdAt:
    type: string
    format: date-time