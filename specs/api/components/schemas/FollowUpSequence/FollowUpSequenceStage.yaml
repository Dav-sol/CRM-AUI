type: object
description: A stage in a follow-up sequence.
required:
  - name
  - offsetDays
  - template
properties:
  name:
    type: string
    minLength: 1
    maxLength: 120
  anchor:
    type: string
    enum: [PURCHASE_DATE, WARRANTY_EXPIRY]
    default: WARRANTY_EXPIRY
    description: |
      Temporal reference for offsetDays.
      PURCHASE_DATE = offset measured from the purchase date;
      WARRANTY_EXPIRY = offset measured from the warranty expiration date.
      Defaults to WARRANTY_EXPIRY when omitted (preserves legacy behavior).
  offsetDays:
    type: integer
    minimum: -365
    maximum: 730
    description: |
      Offset in days from the stage anchor.
      Per-anchor bounds:
      - PURCHASE_DATE: 0..365 (negative offsets rejected).
      - WARRANTY_EXPIRY: -365..730 (negative = before expiration, 0 = day of
        expiration, positive = after expiration).
  template:
    type: string
    minLength: 1
    maxLength: 4096
    description: |
      Message template with placeholders: {customerName}, {productName}, {organizationName}, {warrantyExpiresAt}.
  templateOnPast:
    type: string
    maxLength: 4096
    description: |
      Optional repurchase/renovation message used when a post-expiry stage
      (offsetDays >= 0) has already passed at campaign activation time and the
      purchase's warranty has really expired (HG-SEM-03, Q6 of 021). A
      pre-expiry stage (offsetDays < 0, e.g. D-30) never uses it: while the
      warranty is valid it generates a catch-up with its own `template`, and
      after expiry it is not sent at all. Falls back to the campaign base
      template when absent.