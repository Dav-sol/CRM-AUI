type: object

description: Request body to create a purchase.

required:
  - customerId
  - productId
  - invoiceNumber
  - purchaseDate
  - quantity
  - value

properties:

  customerId:
    type: string
    description: Existing customer within the organization; otherwise 400 VALIDATION_ERROR.

  productId:
    type: string
    description: Existing product within the organization (v1 validates existence only, HG-3); otherwise 400 VALIDATION_ERROR.

  invoiceNumber:
    type: string
    maxLength: 50
    description: Immutable after creation. Duplicate tuples return 409 CONFLICT (CP-005).

  purchaseDate:
    type: string
    format: date-time

  quantity:
    type: integer
    minimum: 1
    maximum: 2147483647
    description: Units of the purchase; capped at the Prisma Int maximum (int4).

  value:
    type: string
    pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
    description: Total purchase value in USD as a string (HG-7).

  status:
    type: string
    enum:
      - COMPLETED
      - CANCELLED
      - REFUNDED
    description: Defaults to COMPLETED.

  warrantyMonths:
    type: integer
    enum: [12, 15, 18, 24]
    description: Optional override of product warranty duration in months (catalog values).

  sourceConversationId:
    type: string
    description: |
      Atribución de ventas (Fase 2): uuid de la conversación que originó la
      venta. Al registrarse, la compra crea su propio ciclo (AU-003).

  quoteId:
    type: string
    description: |
      Atribución de ventas (Fase P0-C): uuid de la cotización aceptada que
      originó la venta. La cotización queda vinculada (ACEPTADA + purchaseId).

  organizationId:
    type: string
    description: Only accepted for PLATFORM_OWNER; required for them. Organization users must not send it (400 VALIDATION_ERROR).