type: object

description: Request body to update a purchase. invoiceNumber is immutable and rejected with 400 if present. customerId and productId are immutable and ignored by the whitelist.

properties:

  invoiceNumber:
    type: string
    description: Always rejected (400) — invoiceNumber is immutable.

  purchaseDate:
    type: string
    description: >-
      Fecha de compra del ERP. Acepta la fecha civil canónica `YYYY-MM-DD`
      (formato recomendado) o un instante ISO 8601 con zona declarada
      (`2026-01-31T18:00:00Z`), que se convierte a su día civil en
      America/Bogota. Se rechaza un instante sin zona por ambiguo. Persistida
      como fecha civil (columna DATE), no como instante.

  quantity:
    type: integer
    minimum: 1
    maximum: 2147483647
    description: Units of the purchase; capped at the Prisma Int maximum (int4).

  value:
    type: string
    pattern: "^\\d{1,10}(\\.\\d{1,2})?$"
    description: Total purchase value in USD as a string.

  status:
    type: string
    enum:
      - COMPLETED
      - CANCELLED
      - REFUNDED
    description: Changed freely without transitional rules (HG-7).

  warrantyMonths:
    type: integer
    enum: [12, 15, 18, 24]
    description: Overrides the effective warranty duration in months (catalog values); recomputes warrantyExpiresAt.