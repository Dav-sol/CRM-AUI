type: object

description: Base automation representation.

required:
  - uuid
  - status
  - scheduledDate
  - executedDate
  - priority
  - purchaseId
  - commercialCycleId
  - createdAt

properties:

  uuid:
    type: string

  status:
    type: string
    enum:
      - PENDING
      - SCHEDULED
      - EXECUTING
      - EXECUTED
      - CANCELLED
      - ERROR
      - PAUSED
    description: |
      Lifecycle of an automation. SCHEDULED → EXECUTING (send in flight) →
      EXECUTED only after the provider confirms; a failed send moves to ERROR
      (bounded retry). ERROR is retryable; PAUSED is reserved for future
      deferred flows.

  scheduledDate:
    type: string
    format: date-time

  executedDate:
    type: string
    format: date-time
    nullable: true

  priority:
    type: integer
    description: Reserved for AU-010 (priority scheduling); always 0 in v1.

  purchaseId:
    type: string
    description: uuid of the triggering purchase.

  commercialCycleId:
    type: string
    description: uuid of the owning commercial cycle.

  campaign:
    type: object
    nullable: true
    required:
      - uuid
      - name
    properties:
      uuid:
        type: string
      name:
        type: string
    description: Campaign that generated this automation, when applicable.

  customer:
    type: object
    nullable: true
    required:
      - name
    properties:
      name:
        type: string
      phone:
        type: string
        nullable: true

  productName:
    type: string
    description: Name of the purchased product (list context).

  messageTemplate:
    type: string
    nullable: true
    description: Snapshot of the message template used at execution time.

  createdAt:
    type: string
    format: date-time