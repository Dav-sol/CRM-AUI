type: object
description: Standard error response envelope.
required:
  - error
properties:
  error:
    type: object
    required:
      - code
      - message
    properties:
      code:
        type: string
        example: VALIDATION_ERROR
      message:
        type: string
        example: "Validation failed"
      details:
        type: object
        additionalProperties: true
        description: Optional error details