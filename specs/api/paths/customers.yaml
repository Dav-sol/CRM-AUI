/customers:
  get:
    tags:
      - Customers

    summary: List customers of the organization

    description: |
      Returns a paginated list of non-deleted customers.
      Organization users only see their own organization; PLATFORM_OWNER sees all.
      Soft-deleted customers are never returned.

    operationId: listCustomers

    security:
      - bearerAuth: []

    parameters:

      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1

      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

      - name: search
        in: query
        required: false
        description: Case-insensitive match over name, codcli, phone and email.
        schema:
          type: string

      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - BLOCKED

      - name: city
        in: query
        required: false
        description: Case-insensitive partial match over city.
        schema:
          type: string

      - name: createdFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time

      - name: createdTo
        in: query
        required: false
        schema:
          type: string
          format: date-time

      - name: sort
        in: query
        required: false
        description: Field sorted by; "-" prefix means descending. Defaults to -createdAt.
        schema:
          type: string
          pattern: "^-?(name|codcli|city|status|createdAt|updatedAt)$"

    responses:

      "200":
        description: Paginated customer list

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Customer/CustomerListResponse.yaml"

      "400":
        description: |
          Two distinct shapes exist, depending on the failure source:

          - **ValidationPipe (DTO)**: malformed query parameters (page/limit/status/city/createdFrom/createdTo/sort pattern). The global exception filter passes the ValidationPipe payload through as `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.
          - **Business logic**: a non-whitelisted `sort` field throws `BAD_REQUEST` in the service, following the standard error envelope.

        content:

          application/json:

            schema:

              oneOf:

                - type: object
                  description: ValidationPipe DTO failure (payload passthrough).
                  required:
                    - statusCode
                    - message
                    - error
                  properties:
                    statusCode:
                      type: integer
                      example: 400
                    message:
                      type: array
                      items:
                        type: string
                      example:
                        - limit must not be greater than 100
                    error:
                      type: string
                      example: Bad Request

                - type: object
                  description: Service business failure (error envelope).
                  required:
                    - error
                  properties:
                    error:
                      type: object
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                          example: BAD_REQUEST
                        message:
                          type: string
                          example: Invalid sort field

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

  post:
    tags:
      - Customers

    summary: Create a customer

    description: |
      Creates a customer in the caller organization.
      codcli must be unique within the organization; duplicates return 409.
      Organization users must not send organizationId; PLATFORM_OWNER must
      send an existing one (VALIDATION_ERROR otherwise).

    operationId: createCustomer

    security:
      - bearerAuth: []

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../components/schemas/Customer/CreateCustomerRequest.yaml"

    responses:

      "201":
        description: Customer created

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Customer/CustomerResponse.yaml"

      "400":
        description: |
          Two distinct shapes exist, depending on the failure source:

          - **ValidationPipe (DTO)**: malformed body (codcli, name, phone, email, address, city, status). The global exception filter passes the ValidationPipe payload through as `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.
          - **Business logic**: organizationId misuse by organization users or PLATFORM_OWNER, or unknown organization — `VALIDATION_ERROR` envelope.

        content:

          application/json:

            schema:

              oneOf:

                - type: object
                  description: ValidationPipe DTO failure (payload passthrough).
                  required:
                    - statusCode
                    - message
                    - error
                  properties:
                    statusCode:
                      type: integer
                      example: 400
                    message:
                      type: array
                      items:
                        type: string
                      example:
                        - name must be shorter than or equal to 200 characters
                    error:
                      type: string
                      example: Bad Request

                - type: object
                  description: Service business failure (error envelope).
                  required:
                    - error
                  properties:
                    error:
                      type: object
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                          example: VALIDATION_ERROR
                        message:
                          type: string
                          example: organizationId is required for PLATFORM_OWNER

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "403":
        description: "OPERADOR cannot write (FORBIDDEN)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: FORBIDDEN
                    message:
                      type: string
                      example: Forbidden

      "409":
        description: "codcli already exists in the organization (CONFLICT)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CONFLICT
                    message:
                      type: string
                      example: A customer with this codcli already exists

/customers/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Customer id

  get:
    tags:
      - Customers

    summary: Get a customer by id

    description: |
      Returns the customer only if it belongs to the caller organization
      (PLATFORM_OWNER may read any). Unknown, cross-tenant or soft-deleted
      customers return 404 CUSTOMER_NOT_FOUND.

    operationId: getCustomer

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Customer detail

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Customer/CustomerResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "404":
        description: "Customer not found, from another organization, or soft-deleted (CUSTOMER_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CUSTOMER_NOT_FOUND
                    message:
                      type: string
                      example: Customer not found

  patch:
    tags:
      - Customers

    summary: Update a customer

    description: |
      Updates mutable contact fields. codcli is immutable; sending it returns 400.
      Unknown, cross-tenant or soft-deleted customers return 404.

    operationId: updateCustomer

    security:
      - bearerAuth: []

    requestBody:
      required: true

      content:
        application/json:
          schema:
            $ref: "../components/schemas/Customer/UpdateCustomerRequest.yaml"

    responses:

      "200":
        description: Customer updated

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Customer/CustomerResponse.yaml"

      "400":
        description: |
          ValidationPipe (DTO) failure only — there is no business 400 on
          PATCH: malformed body fields or an immutable codcli attempt. The
          global exception filter passes the ValidationPipe payload through as
          `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.

        content:

          application/json:

            schema:

              type: object
              required:
                - statusCode
                - message
                - error
              properties:
                statusCode:
                  type: integer
                  example: 400
                message:
                  type: array
                  items:
                    type: string
                  example:
                    - codcli is immutable and cannot be updated
                error:
                  type: string
                  example: Bad Request

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "403":
        description: "OPERADOR cannot write (FORBIDDEN)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: FORBIDDEN
                    message:
                      type: string
                      example: Forbidden

      "404":
        description: "Customer not found, from another organization, or soft-deleted (CUSTOMER_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CUSTOMER_NOT_FOUND
                    message:
                      type: string
                      example: Customer not found

  delete:
    tags:
      - Customers

    summary: Soft-delete a customer

    description: |
      Marks the customer as deleted (deletedAt/deletedBy). The row is kept;
      it is hidden from all queries. Deleting again returns 404.

    operationId: deleteCustomer

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Customer soft-deleted

        content:

          application/json:

            schema:

              type: object

              properties:

                data:
                  type: object
                  properties:
                    success:
                      type: boolean
                      example: true

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "403":
        description: "OPERADOR cannot write (FORBIDDEN)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: FORBIDDEN
                    message:
                      type: string
                      example: Forbidden

      "404":
        description: "Customer not found, from another organization, or already deleted (CUSTOMER_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CUSTOMER_NOT_FOUND
                    message:
                      type: string
                      example: Customer not found