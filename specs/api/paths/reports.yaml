/reports/customers:
  get:
    tags:
      - Reports
    summary: Customer report
    description: |
      Returns customer metrics: total, new in period, pending contact,
      blocked. Supports date range filtering and period grouping.
    operationId: reportCustomers
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Start date (inclusive)
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: End date (inclusive)
      - name: groupBy
        in: query
        schema:
          type: string
          enum: [day, week, month]
          default: month
    responses:
      "200":
        description: Customer report
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    summary:
                      type: object
                      properties:
                        total:
                          type: integer
                        newInPeriod:
                          type: integer
                        pendingContact:
                          type: integer
                        blocked:
                          type: integer
                    rows:
                      type: array
                      items:
                        type: object
                        properties:
                          label:
                            type: string
                          value:
                            type: number
      "401":
        description: Missing or invalid access token

