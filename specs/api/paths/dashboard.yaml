/dashboard/summary:
  get:
    tags:
      - Dashboard

    summary: Global KPIs

    description: |
      Returns the global KPIs of the organization (FR-001), computed
      on-the-fly from the existing org-scoped tables (HG-1). All
      authenticated organization roles may read the dashboard. All counts
      exclude soft-deleted records; month metrics use the UTC calendar
      month (HG-3).

    operationId: getDashboardSummary

    security:
      - bearerAuth: []

    parameters:
      - name: from
        in: query
        required: false
        description: |
          Range start (ISO date or date-only). When absent, defaults to the
          current UTC calendar month. Range KPIs (newInRange, inRange,
          executedInRange, sentInRange, value) are bounded by this range.
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: Range end (ISO date or date-only); when absent, defaults to now.
        schema:
          type: string
      - name: compareFrom
        in: query
        required: false
        description: |
          Previous-period start for deltas (Google Ads style). When present
          with compareTo, every range KPI also returns a % delta vs this period.
        schema:
          type: string
      - name: compareTo
        in: query
        required: false
        description: Previous-period end for deltas.
        schema:
          type: string

    responses:

      "200":
        description: Dashboard KPIs

        content:

          application/json:

            schema:

              $ref: "../components/schemas/Dashboard/DashboardResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

/dashboard/campaigns:
  get:
    tags:
      - Dashboard

    summary: Campaigns panel

    description: |
      Returns the recent campaigns (createdAt desc, take 10) and the
      upcoming scheduled campaigns (ACTIVE with future startAt, ascending)
      of the organization (FR-002).

    operationId: getDashboardCampaigns

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Recent and upcoming campaigns

        content:

          application/json:

            schema:

              $ref: "../components/schemas/Dashboard/DashboardCampaignsResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

/dashboard/activity:
  get:
    tags:
      - Dashboard

    summary: Activity feed

    description: |
      Returns the last 20 audit entries of the organization, newest first
      (FR-003). Read-only view of the existing audit trail; the feed never
      exposes message content or customer PII.

    operationId: getDashboardActivity

    security:
      - bearerAuth: []

    parameters:
      - name: from
        in: query
        required: false
        description: Filter activity newer than this instant (ISO date or date-only).
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: Filter activity older than this instant.
        schema:
          type: string
      - name: compareFrom
        in: query
        required: false
        description: Accepted for symmetry with /dashboard/summary; ignored here.
        schema:
          type: string
      - name: compareTo
        in: query
        required: false
        description: Accepted for symmetry with /dashboard/summary; ignored here.
        schema:
          type: string

    responses:

      "200":
        description: Latest audit entries

        content:

          application/json:

            schema:

              $ref: "../components/schemas/Dashboard/DashboardActivityResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

/dashboard/actionable:
  get:
    tags:
      - Dashboard

    summary: Qué hacer hoy (acciones reales)

    description: |
      Returns real, org-scoped decision-support lists (demo D3):
      upcoming SCHEDULED automations, warranties expiring in ~30 days, and
      purchases whose warranty recently expired (repurchase window). Read-only.

    operationId: getDashboardActionable

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Acciones recomendadas

        content:

          application/json:

            schema:

              type: object

              required:
                - data

              properties:

                data:
                  type: object

                  required:
                    - upcomingAutomations
                    - expiringWarranties
                    - repurchaseWindow
                    - openQuotes

                  properties:

                    upcomingAutomations:
                      type: array
                      items:
                        type: object
                        required:
                          - uuid
                          - scheduledDate
                          - status
                          - customerName
                          - customerUuid
                          - productName
                        properties:
                          uuid:
                            type: string
                          scheduledDate:
                            type: string
                            format: date-time
                          status:
                            type: string
                          customerName:
                            type: string
                          customerUuid:
                            type: string
                          productName:
                            type: string
                          campaignName:
                            type: string
                            nullable: true

                    expiringWarranties:
                      type: array
                      items:
                        type: object
                        required:
                          - purchaseId
                          - customerName
                          - customerUuid
                          - productName
                          - warrantyExpiresAt
                        properties:
                          purchaseId:
                            type: string
                          customerName:
                            type: string
                          customerUuid:
                            type: string
                          productName:
                            type: string
                          warrantyExpiresAt:
                            type: string
                            format: date-time

                    repurchaseWindow:
                      type: array
                      items:
                        type: object
                        required:
                          - purchaseId
                          - customerName
                          - customerUuid
                          - productName
                          - warrantyExpiresAt
                          - potentialValue
                        properties:
                          purchaseId:
                            type: string
                          customerName:
                            type: string
                          customerUuid:
                            type: string
                          productName:
                            type: string
                          warrantyExpiresAt:
                            type: string
                            format: date-time
                          potentialValue:
                            type: number

                    openQuotes:
                      type: array
                      items:
                        type: object
                        required:
                          - uuid
                          - customerName
                          - value
                          - createdAt
                        properties:
                          uuid:
                            type: string
                          customerName:
                            type: string
                          value:
                            type: number
                          sentAt:
                            type: string
                            format: date-time
                            nullable: true
                          createdAt:
                            type: string
                            format: date-time

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized