/purchases:
  get:
    tags:
      - Purchases

    summary: List purchases of the organization

    description: |
      Returns a paginated list of purchases ordered by -purchaseDate.
      Organization users only see their own organization; PLATFORM_OWNER sees all.
      Includes customer and product summaries for each purchase.

    operationId: listPurchases

    security:
      - bearerAuth: []

    parameters:

      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1

      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

      - name: search
        in: query
        required: false
        description: Case-insensitive match over invoiceNumber.
        schema:
          type: string

      - name: customerId
        in: query
        required: false
        schema:
          type: string

      - name: productId
        in: query
        required: false
        schema:
          type: string

      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
            - COMPLETED
            - CANCELLED
            - REFUNDED

      - name: dateFrom
        in: query
        required: false
        description: |
          Lower bound on purchaseDate. Date-only (`YYYY-MM-DD`) means the start
          of that day (`>= 00:00:00` UTC); a full ISO datetime keeps its exact
          instant.
        schema:
          type: string
          format: date-time

      - name: dateTo
        in: query
        required: false
        description: |
          Upper bound on purchaseDate. Date-only (`YYYY-MM-DD`) includes the
          whole requested day (`<= 23:59:59.999` UTC); a full ISO datetime
          keeps its exact instant.
        schema:
          type: string
          format: date-time

      - name: sort
        in: query
        required: false
        description: Field sorted by; "-" prefix means descending. Defaults to -purchaseDate.
        schema:
          type: string
          pattern: "^-?(purchaseDate|invoiceNumber|quantity|value|status|createdAt|updatedAt)$"

    responses:

      "200":
        description: Paginated purchase list

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Purchase/PurchaseListResponse.yaml"

      "400":
        description: |
          Two distinct shapes exist, depending on the failure source:

          - **ValidationPipe (DTO)**: malformed query parameters (page/limit/status/dateFrom/dateTo/sort pattern). The global exception filter passes the ValidationPipe payload through as `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.
          - **Business logic**: a non-whitelisted `sort` field throws `BAD_REQUEST` in the service, following the standard error envelope.

        content:

          application/json:

            schema:

              oneOf:

                - type: object
                  description: ValidationPipe DTO failure (payload passthrough).
                  required:
                    - statusCode
                    - message
                    - error
                  properties:
                    statusCode:
                      type: integer
                      example: 400
                    message:
                      type: array
                      items:
                        type: string
                      example:
                        - sort must match ^-?(purchaseDate|invoiceNumber|quantity|value|status|createdAt|updatedAt)$ regular expression
                    error:
                      type: string
                      example: Bad Request

                - type: object
                  description: Service business failure (error envelope).
                  required:
                    - error
                  properties:
                    error:
                      type: object
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                          example: BAD_REQUEST
                        message:
                          type: string
                          example: Invalid sort field

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string

      "500":
        description: Internal error

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: INTERNAL_ERROR
                    message:
                      type: string

  post:
    tags:
      - Purchases

    summary: Create a purchase

    description: |
      Creates a purchase for the organization of the authenticated user
      (PLATFORM_OWNER must send organizationId, which is validated to exist).
      OPERADOR is not allowed (403).
      Duplicate tuples (organizationId, invoiceNumber, customerId, productId,
      purchaseDate) return 409 CONFLICT (CP-005).

    operationId: createPurchase

    security:
      - bearerAuth: []

    requestBody:

      required: true

      content:

        application/json:

          schema:
            $ref: "../components/schemas/Purchase/CreatePurchaseRequest.yaml"

    responses:

      "201":
        description: Purchase created

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Purchase/PurchaseResponse.yaml"

      "400":
        description: |
          Two distinct shapes exist, depending on the failure source:

          - **ValidationPipe (DTO)**: malformed body (invoiceNumber, purchaseDate, quantity, value, status). The global exception filter passes the ValidationPipe payload through as `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.
          - **Business logic**: organizationId misuse by organization users or PLATFORM_OWNER, unknown organization, or customer/product not found in the organization — `VALIDATION_ERROR` envelope.

        content:

          application/json:

            schema:

              oneOf:

                - type: object
                  description: ValidationPipe DTO failure (payload passthrough).
                  required:
                    - statusCode
                    - message
                    - error
                  properties:
                    statusCode:
                      type: integer
                      example: 400
                    message:
                      type: array
                      items:
                        type: string
                      example:
                        - value must match ^\d{1,10}(\.\d{1,2})?$ regular expression
                    error:
                      type: string
                      example: Bad Request

                - type: object
                  description: Service business failure (error envelope).
                  required:
                    - error
                  properties:
                    error:
                      type: object
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                          example: VALIDATION_ERROR
                        message:
                          type: string
                          example: Customer not found in this organization

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string

      "403":
        description: OPERADOR is read-only in v1

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: FORBIDDEN
                    message:
                      type: string

      "409":
        description: Duplicate purchase tuple (CP-005)

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CONFLICT
                    message:
                      type: string
                      example: A purchase with this invoiceNumber already exists

      "500":
        description: Internal error

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: INTERNAL_ERROR
                    message:
                      type: string

/purchases/{id}:
  parameters:

    - name: id
      in: path
      required: true
      schema:
        type: string

  get:
    tags:
      - Purchases

    summary: Get a purchase by id

    description: |
      Returns a single purchase with its customer and product summaries.
      Returns 404 PURCHASE_NOT_FOUND for unknown ids or purchases of another
      organization.

    operationId: getPurchase

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Purchase detail

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Purchase/PurchaseResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string

      "404":
        description: Purchase not found or not accessible in this organization

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: PURCHASE_NOT_FOUND
                    message:
                      type: string
                      example: Purchase not found

      "500":
        description: Internal error

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: INTERNAL_ERROR
                    message:
                      type: string

  patch:
    tags:
      - Purchases

    summary: Update a purchase

    description: |
      Updates mutable fields of a purchase (purchaseDate, quantity, value,
      status). invoiceNumber is immutable and rejected with 400. customerId and
      productId are immutable and ignored by the whitelist. OPERADOR is not
      allowed (403).

    operationId: updatePurchase

    security:
      - bearerAuth: []

    requestBody:

      required: true

      content:

        application/json:

          schema:
            $ref: "../components/schemas/Purchase/UpdatePurchaseRequest.yaml"

    responses:

      "200":
        description: Purchase updated

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Purchase/PurchaseResponse.yaml"

      "400":
        description: |
          ValidationPipe (DTO) failure only — there is no business 400 on PATCH:
          malformed value/quantity/purchaseDate/status or an immutable
          invoiceNumber attempt. The global exception filter passes the
          ValidationPipe payload through as
          `{"statusCode": 400, "message": [string], "error": "Bad Request"}`.

        content:

          application/json:

            schema:

              type: object
              required:
                - statusCode
                - message
                - error
              properties:
                statusCode:
                  type: integer
                  example: 400
                message:
                  type: array
                  items:
                    type: string
                  example:
                    - invoiceNumber is immutable and cannot be updated
                error:
                  type: string
                  example: Bad Request

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string

      "403":
        description: OPERADOR is read-only in v1

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: FORBIDDEN
                    message:
                      type: string

      "404":
        description: Purchase not found or not accessible in this organization

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: PURCHASE_NOT_FOUND
                    message:
                      type: string
                      example: Purchase not found

      "500":
        description: Internal error

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: INTERNAL_ERROR
                    message:
                      type: string