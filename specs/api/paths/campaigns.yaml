/campaigns/{uuid}/preview-segment:
  parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Campaign uuid

  post:
    tags:
      - Campaigns

    summary: Preview a campaign segment

    description: |
      Dry-run of the segment resolution (FR-005). When the body is
      omitted, the campaign stored segment is resolved; otherwise the
      supplied segment (which must include at least one criterion) is
      used. No automations are created and no PII is returned.

    operationId: previewCampaignSegment

    security:
      - bearerAuth: []

    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../components/schemas/Campaign/CampaignSegment.yaml"

    responses:

      "200":
        description: Qualifying customers count

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Campaign/SegmentPreviewResponse.yaml"

      "400":
        description: Segment without criteria (VALIDATION_ERROR)

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: VALIDATION_ERROR
                    message:
                      type: string
                      example: segment must include at least one criterion

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "404":
        description: "Unknown or cross-tenant campaign (CAMPAIGN_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CAMPAIGN_NOT_FOUND
                    message:
                      type: string
                      example: Campaign not found