/campaigns/segment-preview:
  post:
    tags:
      - Campaigns

    summary: Stateless segment preview for the campaign creator

    description: |
      Dry-run resolution of an audience without an existing campaign (Fase 3).
      Returns the qualifying customers, the estimated generated automations
      (customers × stages when a followUpSequence is referenced) and the
      estimated WhatsApp cost (COP). No automations are created, no PII is
      returned.

    operationId: previewCampaignSegmentDraft

    security:
      - bearerAuth: []

    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              segment:
                $ref: "../components/schemas/Campaign/CampaignSegment.yaml"
              followUpSequenceId:
                type: string
                description: uuid of a follow-up sequence to estimate stages (optional).
              type:
                type: string
                enum: [AUTOMATIC, MANUAL, REPURCHASE, SPECIAL]
                description: |
                  Tipo de campaña para estimar la tarifa por propósito
                  (transaccional vs comercial, Fase P0.2).
              channel:
                type: string
                enum: [SMS, WHATSAPP_CLIENTS]
                description: |
                  Canal de envío para estimar costo por segmentos SMS (Fase 1).

    responses:

      "200":
        description: Estimated audience and cost

        content:

          application/json:

            schema:

              $ref: "../components/schemas/Campaign/SegmentPreviewResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized
