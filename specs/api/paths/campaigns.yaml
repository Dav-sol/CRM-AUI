/campaigns/{uuid}/cancel:
  parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Campaign uuid

  post:
    tags:
      - Campaigns

    summary: Cancel a campaign

    description: |
      Transitions DRAFT/ACTIVE/PAUSED → CANCELLED (terminal) and cancels
      all pending SCHEDULED automations of the campaign inside a single
      transaction (FR-009). Terminal states return 400 VALIDATION_ERROR.

    operationId: cancelCampaign

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Campaign cancelled

        content:

          application/json:

            schema:

              type: object

              required:
                - data

              properties:

                data:

                  type: object

                  required:
                    - uuid
                    - status

                  properties:

                    uuid:
                      type: string

                    status:
                      type: string
                      enum:
                        - CANCELLED

      "400":
        description: Campaign is already in a terminal state (VALIDATION_ERROR)

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: VALIDATION_ERROR
                    message:
                      type: string
                      example: Campaign is already in a terminal state

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "404":
        description: "Unknown or cross-tenant campaign (CAMPAIGN_NOT_FOUND)"

        content:

          application/json:

            schema:

