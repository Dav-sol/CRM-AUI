/messages:
  get:
    tags:
      - Messages

    summary: List WhatsApp messages

    description: |
      Returns a paginated list of messages ordered by -createdAt.
      Organization users only see messages belonging to their own
      organization; PLATFORM_OWNER sees all.

    operationId: listMessages

    security:
      - bearerAuth: []

    parameters:

      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1

      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

      - name: conversationId
        in: query
        required: false
        description: uuid of the owning conversation.
        schema:
          type: string

      - name: status
        in: query
        required: false
        description: Exact match over the delivery status.
        schema:
          type: string
          enum:
            - QUEUED
            - SENT
            - DELIVERED
            - READ
            - FAILED

      - name: direction
        in: query
        required: false
        description: Exact match over the direction.
        schema:
          type: string
          enum:
            - INBOUND
            - OUTBOUND

      - name: automationId
        in: query
        required: false
        description: uuid of the producing automation.
        schema:
          type: string

      - name: createdFrom
        in: query
        required: false
        description: |
          Lower bound on createdAt. Date-only (`YYYY-MM-DD`) means the start
          of that day; a full ISO datetime keeps its exact instant.
        schema:
          type: string
          format: date-time

      - name: createdTo
        in: query
        required: false
        description: |
          Upper bound on createdAt. Date-only (`YYYY-MM-DD`) includes the
          whole requested day.
        schema:
          type: string
          format: date-time

      - name: sort
        in: query
        required: false
        description: Field sorted by; "-" prefix means descending. Defaults to -createdAt.
        schema:
          type: string
          pattern: "^-?(createdAt|sentAt|status)$"

    responses:

      "200":
        description: Paginated message list

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Message/MessageListResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

  post:
    tags:
      - Messages

    summary: Send a manual WhatsApp message

    description: |
      Finds or opens the customer's OPEN conversation for the channel (R-010)
      and sends an OUTBOUND MANUAL message. The provider call is synchronous:
      on success the response is the persisted message with status SENT; on
      provider failure the message is recorded FAILED and the request returns
      502 PROVIDER_ERROR (FR-004, R-011, NR-011). Requires a customer with a
      phone number; customers without a phone return 400 CUSTOMER_NO_PHONE.
      An optional Idempotency-Key header makes repeated submissions with the
      same key return the original result instead of sending twice (WR-06).

    operationId: sendManualMessage

    security:
      - bearerAuth: []

    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          Optional idempotency key (max 64 chars). Repeated POSTs with the
          same key and customerId/content reuse the recorded result.
        schema:
          type: string
          maxLength: 64

    requestBody:

      required: true

      content:

        application/json:

          schema:
            $ref: "../components/schemas/Message/CreateMessageRequest.yaml"

    responses:

      "201":
        description: Message sent and persisted with status SENT

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Message/MessageResponse.yaml"

      "400":
        description: "Customer has no phone number (CUSTOMER_NO_PHONE)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CUSTOMER_NO_PHONE
                    message:
                      type: string
                      example: Customer has no phone number

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "404":
        description: "Unknown or cross-tenant customer (CUSTOMER_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: CUSTOMER_NOT_FOUND
                    message:
                      type: string
                      example: Customer not found

      "502":
        description: "WhatsApp provider could not deliver the message (PROVIDER_ERROR)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: PROVIDER_ERROR
                    message:
                      type: string
                      example: WhatsApp provider could not deliver the message

/messages/{uuid}:
  parameters:
    - name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Message uuid

  get:
    tags:
      - Messages

    summary: Get a message by uuid

    description: |
      Returns the message with its customer context only if it belongs to
      the caller organization (PLATFORM_OWNER may read any). Unknown or
      cross-tenant messages return 404 MESSAGE_NOT_FOUND.

    operationId: getMessage

    security:
      - bearerAuth: []

    responses:

      "200":
        description: Message detail

        content:

          application/json:

            schema:
              $ref: "../components/schemas/Message/MessageResponse.yaml"

      "401":
        description: Missing or invalid access token

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: UNAUTHORIZED
                    message:
                      type: string
                      example: Unauthorized

      "404":
        description: "Unknown or cross-tenant message (MESSAGE_NOT_FOUND)"

        content:

          application/json:

            schema:

              type: object

              properties:

                error:
                  type: object
                  required:
                    - code
                    - message
                  properties:
                    code:
                      type: string
                      example: MESSAGE_NOT_FOUND
                    message:
                      type: string
                      example: Message not found